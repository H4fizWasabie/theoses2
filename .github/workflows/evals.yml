name: Evals

# Model-backed coding evals against the production model (gpt-6-luna at thinking max since 2026-09-30; GLM 5.3 flash before). Costs real money, so it runs
# on demand, once a week, and on pushes to main that change what the model is told (the system prompt) or what it can
# call (the tools). Never on pull requests: a public repo must not hand a paid key to PR code, so a prompt or tool
# change is measured right after it lands, and the floors below fail the job if it made the agent worse.
# A run is about 16 tasks, roughly 2 cents per pass; the OPENROUTER_API_KEY secret has a hard credit limit.
on:
  push:
    branches: [main]
    paths:
      - "packages/coding-agent/src/core/system-prompt.ts"
      - "packages/coding-agent/src/core/session-system-prompt.ts"
      - "packages/coding-agent/src/core/tools/**"
      - "packages/agent/src/**"
  workflow_dispatch:
    inputs:
      passes:
        description: "Passes per task"
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      thinking:
        description: "Thinking level. Production runs max."
        default: "max"
        type: choice
        options: ["max", "xhigh", "high", "medium", "low"]
      sibling_hint:
        description: "default = the setting's default (on); off = run without the edit sibling hint"
        default: "default"
        type: choice
        options: ["default", "off"]
      model:
        description: "OpenRouter model id. Leave the default to measure the production model."
        default: "openai/gpt-6-luna"
        type: string
      suite:
        description: "coding = the easy, hard, edit-recovery and real-fix replay sets; plan-ab = the hard set with the task plan off vs on (3 repetitions each); task-ab = the same with the task sub-agent tool off vs on; prompt-ab = the same with and without the working-discipline paragraph in the system prompt; hint-ab = the same with and without the edit sibling hint; diagnose = the two tasks the production model always fails, for use with `model`"
        default: "coding"
        type: choice
        options: ["coding", "plan-ab", "task-ab", "prompt-ab", "hint-ab", "diagnose"]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: evals
  cancel-in-progress: false

permissions: {}

jobs:
  evals:
    # Forks have no secret; skip there instead of failing.
    if: github.repository == 'H4fizWasabie/theoses2'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUITE: ${{ inputs.suite || 'coding' }}
      PASSES: ${{ inputs.passes || '1' }}
      MODEL: ${{ inputs.model || 'openai/gpt-6-luna' }}
      EVAL_THINKING_LEVEL: ${{ inputs.thinking || 'max' }}
      EVAL_SIBLING_HINT: ${{ inputs.sibling_hint == 'off' && 'off' || '' }}
    steps:
      # The runner context is not available in job-level env, so the directory is set here.
      - name: Choose the run-record directory
        run: echo "EVAL_DIR=$RUNNER_TEMP/evals" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The replay tasks start at the parent of a real fix, so they need the history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate the model catalog
        run: npm --prefix packages/ai run generate-models

      - name: Run the coding evals
        # A wrong answer fails its test; the floors below decide whether the job fails, so keep going here.
        continue-on-error: true
        run: |
          if [ "$SUITE" = "plan-ab" ]; then files="src/coding-plan-ab.eval.ts"; elif [ "$SUITE" = "task-ab" ]; then files="src/coding-task-ab.eval.ts"; elif [ "$SUITE" = "prompt-ab" ]; then files="src/coding-prompt-ab.eval.ts"; elif [ "$SUITE" = "hint-ab" ]; then files="src/coding-hint-ab.eval.ts"; elif [ "$SUITE" = "diagnose" ]; then files="src/coding-diagnose.eval.ts"; else files="src/coding.eval.ts src/coding-hard.eval.ts src/coding-recovery.eval.ts src/coding-replay.eval.ts"; fi
          for pass in $(seq 1 "$PASSES"); do
            THEOSES_EVAL_ARTIFACT_DIR="$EVAL_DIR/pass-$pass" npm run eval -- \
              --provider openrouter --model "$MODEL" \
              $files || true
          done

      - name: Summarize
        # Floors sit under what gpt-6-luna scored with the sibling hint on: easy 10/10 and 10/10, hard 25/26 and 22/24, recovery 12/12,
        # replay 16/16 (2 passes each, so they leave room for one miss). On GLM 5.3 flash these were 87%, 76-82%, 100% and 88%.
        # The A/B suites compare two arms and have no floor.
        run: |
          if [ "$SUITE" = "plan-ab" ] || [ "$SUITE" = "task-ab" ] || [ "$SUITE" = "prompt-ab" ] || [ "$SUITE" = "hint-ab" ] || [ "$SUITE" = "diagnose" ]; then
            node packages/evals/scripts/summarize-runs.ts "$EVAL_DIR"
          else
            node packages/evals/scripts/summarize-runs.ts "$EVAL_DIR" --floor coding=0.9 --floor coding-hard=0.8 --floor coding-recovery=0.8 --floor coding-replay=0.75
          fi

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-runs
          path: ${{ runner.temp }}/evals
          retention-days: 30
